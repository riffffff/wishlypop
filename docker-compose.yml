version: '3.8'

services:
  wishly:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wishly-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:/app/data/wishly.db
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://wishlypop.com}
      - LEMONSQUEEZY_MODE=${LEMONSQUEEZY_MODE:-test}
      - LEMON_SQUEEZY_MODE=${LEMON_SQUEEZY_MODE:-test}
      - LEMON_SQUEEZY_API_KEY=${LEMON_SQUEEZY_API_KEY:-}
      - LEMON_SQUEEZY_STORE_ID=${LEMON_SQUEEZY_STORE_ID:-}
      - LEMON_SQUEEZY_VARIANT_ID=${LEMON_SQUEEZY_VARIANT_ID:-}
      - LEMON_SQUEEZY_WEBHOOK_SECRET=${LEMON_SQUEEZY_WEBHOOK_SECRET:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
    volumes:
      - wishly_data:/app/data
      - wishly_uploads:/app/public/uploads
    networks:
      - wishly_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  wishly_data:
    driver: local
  wishly_uploads:
    driver: local

networks:
  wishly_net:
    driver: bridge
