name: 🚀 Wishly CD — Deploy to Production VPS

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '~/wishly' }}

jobs:
  ci-check:
    name: 🧪 Jalankan CI terlebih dahulu
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: 🚀 Deploy ke VPS (SSH + Docker Compose)
    runs-on: ubuntu-latest
    needs: ci-check
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ secrets.NEXT_PUBLIC_APP_URL }}

    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔐 Validate required secrets
        shell: bash
        run: |
          missing=()
          [[ -n "${{ secrets.VPS_HOST }}" ]]    || missing+=("VPS_HOST")
          [[ -n "${{ secrets.VPS_USER }}" ]]    || missing+=("VPS_USER")
          [[ -n "${{ secrets.VPS_SSH_KEY }}" ]] || missing+=("VPS_SSH_KEY")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "❌ Secrets belum disetup: ${missing[*]}"
            echo "   Buka Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          echo "✅ Semua secrets wajib tersedia."

      - name: 🌐 Install SSH key & known_hosts
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: 📂 Rsync source code ke VPS
        run: |
          HOST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT || 22 }}"
          DEPLOY_PATH="${{ env.DEPLOY_PATH }}"

          echo "→ Membuat folder $DEPLOY_PATH (jika belum ada)..."
          ssh -p "$PORT" -o StrictHostKeyChecking=no "$HOST" "mkdir -p $DEPLOY_PATH"

          echo "→ Rsync source code ke $HOST:$DEPLOY_PATH..."
          rsync -avz --delete -e "ssh -p $PORT -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='data' \
            --exclude='public/uploads' \
            --exclude='*.db' \
            --exclude='*.db-journal' \
            --exclude='*.db-wal' \
            --exclude='*.db-shm' \
            --exclude='.env' \
            ./ \
            "$HOST:$DEPLOY_PATH/"

          echo "✅ Source code ter-upload."

      - name: 📝 Sync environment variables (.env) ke server
        shell: bash
        env:
          ENV_DATABASE_URL: ${{ secrets.DATABASE_URL || 'file:/app/data/wishly.db' }}
          ENV_NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          ENV_LEMON_SQUEEZY_API_KEY: ${{ secrets.LEMON_SQUEEZY_API_KEY }}
          ENV_LEMON_SQUEEZY_STORE_ID: ${{ secrets.LEMON_SQUEEZY_STORE_ID }}
          ENV_LEMON_SQUEEZY_VARIANT_ID: ${{ secrets.LEMON_SQUEEZY_VARIANT_ID }}
          ENV_LEMON_SQUEEZY_WEBHOOK_SECRET: ${{ secrets.LEMON_SQUEEZY_WEBHOOK_SECRET }}
          ENV_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          HOST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT || 22 }}"
          DEPLOY_PATH="${{ env.DEPLOY_PATH }}"

          echo "→ Menulis .env ke server..."
          ssh -p "$PORT" -o StrictHostKeyChecking=no "$HOST" \
            DEPLOY_PATH="$DEPLOY_PATH" \
            DATABASE_URL="$ENV_DATABASE_URL" \
            NEXT_PUBLIC_APP_URL="$ENV_NEXT_PUBLIC_APP_URL" \
            LEMON_SQUEEZY_API_KEY="$ENV_LEMON_SQUEEZY_API_KEY" \
            LEMON_SQUEEZY_STORE_ID="$ENV_LEMON_SQUEEZY_STORE_ID" \
            LEMON_SQUEEZY_VARIANT_ID="$ENV_LEMON_SQUEEZY_VARIANT_ID" \
            LEMON_SQUEEZY_WEBHOOK_SECRET="$ENV_LEMON_SQUEEZY_WEBHOOK_SECRET" \
            RESEND_API_KEY="$ENV_RESEND_API_KEY" \
            bash -s <<'REMOTE_EOF'
          set -e
          cd "$DEPLOY_PATH"
          cat > .env <<ENVEOF
          NODE_ENV=production
          NEXT_TELEMETRY_DISABLED=1
          DATABASE_URL=${DATABASE_URL}
          NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
          LEMON_SQUEEZY_API_KEY=${LEMON_SQUEEZY_API_KEY}
          LEMON_SQUEEZY_STORE_ID=${LEMON_SQUEEZY_STORE_ID}
          LEMON_SQUEEZY_VARIANT_ID=${LEMON_SQUEEZY_VARIANT_ID}
          LEMON_SQUEEZY_WEBHOOK_SECRET=${LEMON_SQUEEZY_WEBHOOK_SECRET}
          RESEND_API_KEY=${RESEND_API_KEY}
          ENVEOF
          chmod 600 .env
          echo "✅ .env ditulis di server ($DEPLOY_PATH/.env)"
          REMOTE_EOF
          echo "✅ .env sync selesai."

      - name: 🚀 Jalankan deploy.sh di VPS
        run: |
          HOST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT || 22 }}"
          DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
          echo "→ Menjalankan scripts/deploy.sh di server..."
          ssh -p "$PORT" -o StrictHostKeyChecking=no "$HOST" \
            "cd $DEPLOY_PATH && chmod +x ./scripts/deploy.sh && ./scripts/deploy.sh"

      - name: ✅ Deployment Summary
        if: success()
        run: |
          echo "## 🎉 Wishly Production Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit** : \`${GITHUB_SHA::7}\` by @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**    : ${{ secrets.NEXT_PUBLIC_APP_URL || '(set NEXT_PUBLIC_APP_URL di secrets)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Server** : ${{ secrets.VPS_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**   : $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
