# ==============================================================
# Wishly — Nginx Server Block (Reverse Proxy + Let's Encrypt SSL)
# Domain: wishlypop.com
# ==============================================================
# Setelah install nginx + certbot:
#   sudo apt install -y nginx certbot python3-certbot-nginx
# 1. Simpan file ini sebagai /etc/nginx/sites-available/wishlypop
# 2. Enable site:
#      sudo ln -s /etc/nginx/sites-available/wishlypop /etc/nginx/sites-enabled/
# 3. Test config:
#      sudo nginx -t
# 4. Reload: sudo systemctl reload nginx
# 5. Dapatkan SSL (auto renew 90 hari):
#      sudo certbot --nginx -d wishlypop.com -d www.wishlypop.com --redirect
# ==============================================================

# ---- Redirect HTTP -> HTTPS (wajib!) ----
server {
    listen 80;
    listen [::]:80;
    server_name wishlypop.com www.wishlypop.com;
    return 301 https://wishlypop.com$request_uri;
}

# ---- HTTPS www -> non-www (canonical SEO) ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.wishlypop.com;

    # (Akan diisi Certbot secara otomatis)
    ssl_certificate /etc/letsencrypt/live/wishlypop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wishlypop.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://wishlypop.com$request_uri;
}

# ---- HTTPS utama wishlypop.com -> upstream Next.js :3000 ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wishlypop.com;

    # SSL - diisi otomatis oleh Certbot
    ssl_certificate /etc/letsencrypt/live/wishlypop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wishlypop.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logging
    access_log /var/log/nginx/wishlypop-access.log;
    error_log  /var/log/nginx/wishlypop-error.log warn;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Upload max 32MB (upload foto ecard)
    client_max_body_size 32M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Reverse proxy ke Wishly app (Docker port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts yang aman
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        # Buffer besar untuk Next.js response
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }
}
